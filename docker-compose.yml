networks:
  fantasy_football_tools_network:
    name: fantasy_football_tools_network
    internal: true

  npm_network:
    name: npm_network
    external: true

services:
  storage-init:
    build:
      context: .
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /app/persistent_data/bid_manager_auctions /app/persistent_data/notes_manager_notes
        chown 1000:1000 /app/persistent_data
        chown -hR 1000:1000 /app/persistent_data/bid_manager_auctions /app/persistent_data/notes_manager_notes
        chmod u+rwx /app/persistent_data /app/persistent_data/bid_manager_auctions /app/persistent_data/notes_manager_notes
    volumes:
      - ./persistent_data:/app/persistent_data
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    restart: "no"

  fantasy-football-tools:
    container_name: fantasy-football-tools
    build:
      context: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:${APP_PORT:-5010}:5010"
    volumes:
      - ./persistent_data:/app/persistent_data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5010/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      storage-init:
        condition: service_completed_successfully
      fantasy-football-tools-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - npm_network
      - fantasy_football_tools_network

  retention-worker:
    build:
      context: .
    command: ["python", "-m", "data_retention"]
    volumes:
      - ./persistent_data/bid_manager_auctions:/app/persistent_data/bid_manager_auctions
      - ./persistent_data/notes_manager_notes:/app/persistent_data/notes_manager_notes
    tmpfs:
      - /tmp
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    depends_on:
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; assert time.time() - float(Path('/tmp/retention-worker-heartbeat').read_text()) < 180"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  fantasy-football-tools-db:
    container_name: fantasy-football-tools-db
    
    image: mariadb:11.4
    
    env_file:
      - .env
    volumes:
      - ./persistent_data/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --host=127.0.0.1 --user=root --password=\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    
    restart: unless-stopped
    networks:
      fantasy_football_tools_network:
        aliases:
          - db
