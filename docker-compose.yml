networks:
  fantasy_football_tools_network:
    name: fantasy_football_tools_network
    internal: true

services:
  fantasy-football-tools:
    container_name: fantasy-football-tools
    
    build:
      context: .
    
    env_file:
      - .env
    
    ports:
      - "5010:5010"
    
    volumes:
      - ./persistent_data:/app/persistent_data
    
    depends_on:
      fantasy-football-tools-db:
        condition: service_healthy
    
    restart: unless-stopped
    
    networks:
      - fantasy_football_tools_network

  fantasy-football-tools-db:
    container_name: fantasy-football-tools-db
    
    image: mariadb:11.4
    
    env_file:
      - .env
    
    volumes:
      - ./persistent_data/mariadb:/var/lib/mysql
    
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --host=127.0.0.1 --user=root --password=\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    
    restart: unless-stopped
    
    networks:
        - db_network