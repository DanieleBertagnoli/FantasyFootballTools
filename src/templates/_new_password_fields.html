  <div class="auth-field auth-password-field">
    <label for="{{ password_prefix }}Password">Nuova password</label>
    <div class="auth-password-control">
      <input id="{{ password_prefix }}Password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128"
        aria-describedby="{{ password_prefix }}PasswordStrength {{ password_prefix }}PasswordHelp" data-password-input required>
      <button class="auth-password-toggle" type="button" data-password-toggle aria-controls="{{ password_prefix }}Password"
        aria-label="Mostra password">
        <span aria-hidden="true">◉</span>
      </button>
    </div>
    <div id="{{ password_prefix }}PasswordStrength" class="password-strength" data-password-strength-meter role="progressbar"
      aria-label="Sicurezza della password" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0">
      <span></span><span></span><span></span><span></span>
    </div>
    <p class="password-strength-label" data-password-strength-label>Inserisci una password per valutarne la sicurezza.</p>
    <ul id="{{ password_prefix }}PasswordHelp" class="password-checklist" aria-label="Requisiti della password">
      <li data-password-rule="length"><span aria-hidden="true">○</span> Almeno 8 caratteri</li>
      <li data-password-rule="case"><span aria-hidden="true">○</span> Una lettera maiuscola e una minuscola</li>
      <li data-password-rule="number"><span aria-hidden="true">○</span> Almeno un numero</li>
      <li data-password-rule="symbol"><span aria-hidden="true">○</span> Almeno un simbolo</li>
    </ul>
  </div>

  <div class="auth-field auth-password-field">
    <label for="{{ password_prefix }}PasswordConfirmation">Conferma nuova password</label>
    <div class="auth-password-control">
      <input id="{{ password_prefix }}PasswordConfirmation" name="password_confirmation" type="password" autocomplete="new-password"
        minlength="8" maxlength="128" aria-describedby="{{ password_prefix }}PasswordMatch" data-password-confirmation required>
      <button class="auth-password-toggle" type="button" data-password-toggle aria-controls="{{ password_prefix }}PasswordConfirmation"
        aria-label="Mostra password">
        <span aria-hidden="true">◉</span>
      </button>
    </div>
    <p id="{{ password_prefix }}PasswordMatch" class="auth-field-note" data-password-match aria-live="polite"></p>
  </div>
